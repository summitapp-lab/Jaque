html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;height:46px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo .pawn{width:28px;height:28px}
.logo b{color:var(--green)}
.top .sp{flex:1}
.ibtn{background:transparent;width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--mut)}
.ibtn:hover{background:rgba(255,255,255,.08);color:#fff}
.ibtn svg{width:22px;height:22px}
.app{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:4px 12px 16px}
.bcol{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;gap:8px}
/* eval bar */
.evalbar{width:22px;height:var(--bs);background:#403d39;border-radius:3px;position:relative;overflow:hidden;display:none;flex:none}
.evalbar.on{display:block}
.evalbar .w{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .45s ease}
.evalbar .t{position:absolute;left:0;right:0;font-size:9.5px;font-weight:800;text-align:center;z-index:2}
.evalbar .t.b{bottom:4px;color:#403d39}.evalbar .t.tp{top:4px;color:#fff}
.evalbar.flip{transform:rotate(180deg)}.evalbar.flip .t{transform:rotate(180deg)}
/* player bars */
.pbar{display:flex;align-items:center;gap:10px;height:44px;width:var(--bs);position:relative}
.av{width:40px;height:40px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden}
.av svg{width:100%;height:100%}
.pname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.pname .elo{color:var(--mut);font-weight:400}
.caps{display:flex;align-items:center;height:16px;margin-top:2px}
.caps i{width:16px;height:16px;background-size:100%;margin-right:-7px;display:inline-block;filter:drop-shadow(0 0 .5px rgba(0,0,0,.5))}
.caps i.gap{margin-left:7px}
.caps span{margin-left:10px;font-size:12px;color:var(--mut);font-weight:600}
.bubble{position:absolute;left:52px;bottom:40px;background:#fff;color:#312e2b;font-size:13px;padding:7px 11px;border-radius:10px;max-width:280px;box-shadow:0 3px 10px rgba(0,0,0,.35);z-index:30;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.pbar.bot .bubble{bottom:auto;top:40px}
/* board */
.board{width:var(--bs);height:var(--bs);position:relative;border-radius:3px;overflow:hidden;touch-action:none;flex:none}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq .hl{position:absolute;inset:0}
.sq .co{position:absolute;font-size:calc(var(--sq) * .2);font-weight:700;line-height:1}
.sq .co.r{top:3%;left:5%}.sq .co.f{bottom:3%;right:6%}
.sq.l .co{color:var(--dark)}.sq.d .co{color:var(--light)}
.dot{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.dot:after{content:"";width:33%;height:33%;border-radius:50%;background:rgba(0,0,0,.14)}
.dot.cap:after{width:100%;height:100%;background:none;border-radius:50%;box-sizing:border-box;border:calc(var(--sq) * .085) solid rgba(0,0,0,.14)}
.sq.hov{box-shadow:inset 0 0 0 calc(var(--sq) * .06) rgba(255,255,255,.65)}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background-size:100% 100%;will-change:transform;z-index:2}
.pc.anim{transition:transform .12s ease-out}
.pc.drag{z-index:20;transition:none;cursor:grabbing}
.pc.ghost{opacity:.4}
.chk{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,0,0,1) 0%,rgba(231,0,0,1) 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%)}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.cicon{position:absolute;width:calc(var(--sq) * .44);height:calc(var(--sq) * .44);z-index:15;pointer-events:none;transform:translate(-30%,-30%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-30%,-30%) scale(.3)}to{transform:translate(-30%,-30%) scale(1)}}
.promo{position:absolute;z-index:40;width:12.5%;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.5);border-radius:3px;display:flex;flex-direction:column}
.promo div{aspect-ratio:1;background-size:90%;background-position:center;background-repeat:no-repeat;cursor:pointer;border-radius:50%;background-color:#b0b0b0;margin:2px}
.promo div:hover{background-color:#f3a845}
.promo-x{position:absolute;inset:0;z-index:39;background:rgba(0,0,0,.25)}
/* panel */
.panel{width:420px;background:var(--panel);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;flex:none}
.ph{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;font-weight:800;font-size:19px;border-bottom:1px solid #1c1b19}
.ph svg{width:24px;height:24px}
.pbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.pfoot{padding:12px 14px;background:var(--panel2);display:flex;flex-direction:column;gap:10px}
.btn{background:var(--green);box-shadow:0 5px 0 var(--green-d);border-radius:10px;font-size:21px;font-weight:800;padding:15px 12px 13px;width:100%;text-shadow:0 1px 0 rgba(0,0,0,.25);transition:background .12s}
.btn:hover{background:#a3d160}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.btn.sm{font-size:16px;padding:11px 10px 9px;box-shadow:0 4px 0 var(--green-d)}
.btn2{background:rgba(255,255,255,.08);box-shadow:0 4px 0 rgba(0,0,0,.25);border-radius:8px;font-size:15px;font-weight:700;padding:10px 12px;color:#e8e6e3;display:flex;align-items:center;justify-content:center;gap:7px}
.btn2:hover{background:rgba(255,255,255,.14)}
.btn2:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn2 svg{width:19px;height:19px}
.btn2.on{background:#f0c84b;color:#312e2b}
.row{display:flex;gap:8px}.row>*{flex:1}
.lbl{color:var(--mut);font-size:13px;font-weight:700;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.4px}
.lbl:first-child{margin-top:0}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:8px;padding:11px 12px;text-align:left;cursor:pointer}
.mode.sel{border-color:var(--green);background:rgba(129,182,76,.12)}
.mode .mi{width:38px;height:38px;flex:none;border-radius:8px;display:grid;place-items:center;background:#3a3835}
.mode .mi svg{width:24px;height:24px}
.mode b{display:block;font-size:15px}.mode small{color:var(--mut);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.botsel{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border-radius:8px;padding:12px;margin-bottom:10px}
.botsel .av{width:64px;height:64px;font-size:28px;border-radius:6px}
.botsel b{font-size:17px}.botsel .elo{color:var(--mut)}
.botsel p{margin:3px 0 0;color:var(--mut);font-size:13px;line-height:1.35}
.bots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.bots button{background:transparent;padding:0;border-radius:6px;border:3px solid transparent;aspect-ratio:1;overflow:hidden}
.bots button.sel{border-color:var(--green)}
.bots .av{width:100%;height:100%;border-radius:3px;font-size:17px}
.colors{display:flex;gap:10px;justify-content:center}
.colors button{width:64px;height:64px;border-radius:8px;background:rgba(255,255,255,.06);border:3px solid transparent;display:grid;place-items:center}
.colors button.sel{border-color:var(--green)}
.colors i{width:46px;height:46px;background-size:100%}
.colors .rnd{width:46px;height:46px;background:linear-gradient(90deg,#fff 50%,#2d2b28 50%);border-radius:50%;display:grid;place-items:center;font-weight:900;color:#81b64c;font-size:22px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:8px}
.sw{width:42px;height:24px;border-radius:12px;background:#55524e;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on:after{left:21px}
/* moves */
.moves{font-size:14.5px;font-weight:600}
.mrow{display:grid;grid-template-columns:42px 1fr 1fr;align-items:center;padding:1px 6px;border-radius:3px}
.mrow:nth-child(even){background:rgba(255,255,255,.025)}
.mrow .n{color:var(--mut2);font-weight:400}
.mv{padding:4px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;justify-self:start;cursor:default}
.mv.cur{background:rgba(255,255,255,.17);border-bottom:2px solid rgba(255,255,255,.3)}
.mv.clk{cursor:pointer}.mv.clk:hover{background:rgba(255,255,255,.1)}
.mv svg{width:16px;height:16px;flex:none}
.status{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;min-height:22px}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.coach .cav{width:58px;height:58px;flex:none;border-radius:50%;overflow:hidden;background:#3a3835}
.cbub{position:relative;background:#fff;color:#2b2926;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;flex:1;min-height:58px}
.cbub:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.cbub .ct{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;margin-bottom:3px}
.cbub .ct svg{width:22px;height:22px;flex:none}
.cbub .ev{float:right;font-size:12px;font-weight:800;background:#e9e7e4;border-radius:4px;padding:2px 6px;margin-left:6px}
.cbub .ev.bk{background:#403d39;color:#fff}
.cbub p{margin:4px 0 0}
.cbub .best{margin-top:7px;padding-top:7px;border-top:1px solid #e6e3df;font-size:13px;color:#4b4844}
.cbub .best b{color:#2b2926}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#5d9948}
/* review */
.coach .cav{position:relative;overflow:visible}.coach .cav svg{border-radius:50%}.say{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#81b64c;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.4);padding:0}.say svg{width:14px;height:14px;border-radius:0!important;color:#fff}
select.vsel{flex:1;min-width:0;background:#3a3835;color:#fff;border:0;border-radius:8px;padding:10px;font-size:14px;font-family:inherit}
.coach.devil .cbub{background:#fff1ef;border:2px solid #e0453a}.coach.devil .cbub:before{border-right-color:#e0453a}.coach.devil .ct svg{color:#d9483b}
.btn2.on.dv{background:#e0453a;color:#fff}
#rvActs{flex-wrap:wrap}#rvActs>*{flex:1 1 30%}
.vrow{display:flex;align-items:center;gap:8px;margin-top:8px}.vrow>span{width:78px;font-size:13px;color:var(--mut);font-weight:700}.vrow .btn2{padding:9px 13px;flex:none}
.vhelp{margin-top:8px;font-size:12.5px;line-height:1.45;color:#e8d9a8;background:rgba(240,200,75,.1);border-radius:8px;padding:9px 11px}.vhelp.ok{color:#b9d99a;background:rgba(129,182,76,.1)}
.mc{display:inline-flex;align-items:center;gap:1px;background:rgba(0,0,0,.07);border-radius:5px;padding:0 6px 0 1px;font-weight:700;white-space:nowrap;vertical-align:-3px;line-height:20px}.mc i{width:19px;height:19px;background-size:100%;display:inline-block;position:static;transform:none}
.steps{margin-top:8px;background:rgba(0,0,0,.04);border-radius:8px;padding:8px}.sth{font-weight:800;color:#2b2926;margin-bottom:4px;font-size:12.5px}
.step{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;color:#2b2926;line-height:1.3}.step .num{width:18px;height:18px;border-radius:50%;background:#81b64c;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}
.step .who{font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 5px;flex:none;min-width:34px;text-align:center}.step .who.w{background:#fff;color:#333;box-shadow:inset 0 0 0 1px #bbb}.step .who.b{background:#403d39;color:#fff}
.step i{width:22px;height:22px;background-size:100%;display:inline-block;position:static;transform:none;flex:none}
.btn2.pl{margin-top:6px;width:100%;background:#81b64c;color:#fff;box-shadow:0 3px 0 #45753c;font-size:13.5px;padding:8px}
.pvbar{position:absolute;left:0;right:0;top:0;z-index:50;background:rgba(38,37,34,.92);color:#fff;font-size:13.5px;padding:8px 10px;display:flex;align-items:center;gap:8px}.pvbar span{flex:1}.pvbar button{background:#81b64c;border-radius:6px;padding:5px 10px;font-weight:800;font-size:13px}
.nota{font-size:12.5px;color:var(--mut);cursor:pointer;margin:8px 0 4px;text-decoration:underline}
#notaHelp{display:none;background:rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;color:#ddd;margin-bottom:8px}#notaHelp.on{display:block}#notaHelp b{color:#fff}
.oinfo{background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;margin-bottom:6px}.otags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}.otags span{font-size:12px;background:rgba(255,255,255,.07);border-radius:5px;padding:3px 7px;color:var(--mut)}.otags b{color:#fff}
.olbl{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 4px}.oli{font-size:13.5px;line-height:1.45;color:#e8e6e3;margin:3px 0}.oli.ok{color:#c8e6a8}.oli.ko{color:#ffc4bc}
.rA{color:#ff8a7a!important}.rM{color:#f7c045!important}.rB{color:#9fd36b!important}.btn2.lis{margin-top:10px;width:100%;font-size:13.5px}
.oguide{background:rgba(129,182,76,.1);border:1px solid rgba(129,182,76,.35);border-radius:8px;margin-bottom:6px}.oghead{padding:10px 12px;font-weight:800;font-size:14px;cursor:pointer;display:flex;justify-content:space-between}.ogbody{padding:0 12px 12px;font-size:13.5px;line-height:1.5;color:#e8e6e3}.ogbody b{color:#fff}
.otab{width:100%;border-collapse:collapse;font-size:12px}.otab th{text-align:left;color:var(--mut);font-weight:700;padding:4px 3px;border-bottom:1px solid #3d3a36}.otab td{padding:6px 3px;border-bottom:1px solid #33312e;color:#ddd}.otab tr[data-act]{cursor:pointer}
.lbtns{display:flex;gap:6px;margin-top:9px}.lbtns .btn2{flex:1;font-size:13px;padding:9px 6px}.lbtns .btn2 svg{width:16px;height:16px}.btn2.prc{background:#81b64c;color:#fff;box-shadow:0 4px 0 #45753c}.pok{color:#9fd36b!important;font-weight:700}.badge{font-size:11px;background:#81b64c;color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}.badge.half{background:#6b6862}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);border-radius:9px;padding:4px;margin-bottom:12px}.tabs button{flex:1;background:transparent;border-radius:7px;padding:9px;font-weight:800;font-size:14.5px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px}.tabs button svg{width:20px;height:20px}.tabs button.on{background:#3d3a36;color:#fff}
.ointro{font-size:13.5px;color:var(--mut);line-height:1.45;margin-bottom:10px}.ointro b{color:#fff}
.opc{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:8px;padding:11px 12px;margin-bottom:7px;cursor:pointer}.opc:hover{background:rgba(255,255,255,.1)}.opc>div{flex:1}.opc b{display:block;font-size:15px}.opc small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4;margin-top:3px}.opc .chev{font-size:26px;color:var(--mut)}
.opc.les{border:2px solid rgba(129,182,76,.35)}.lic{width:44px;height:44px;border-radius:8px;background:#3a3835;display:grid;place-items:center;flex:none!important}.lic i{width:36px;height:36px;background-size:100%;display:block;position:static;transform:none}
.lsub{font-size:12.5px;color:var(--mut);font-weight:700}.lpre{display:block;color:#4b4844;font-size:13.5px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #e6e3df}
.gnav .btn2{padding:8px 0}.gview{display:none;align-items:center;justify-content:space-between;gap:8px;background:#f0c84b;color:#312e2b;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:700}.gview.on{display:flex}.gview button{background:#312e2b;color:#fff;border-radius:6px;padding:5px 9px;font-weight:800;font-size:12.5px}
.cbx{padding:12px 14px 0}.cbx:empty{display:none}.cbx .coach{margin-bottom:0}
.tip{display:flex;gap:7px;align-items:flex-start;margin-top:8px;background:#eef6e6;border-radius:7px;padding:7px 9px;font-size:12.8px;line-height:1.4;color:#3b4a2f}.tip svg{width:18px;height:18px;flex:none;margin-top:1px}
.lesson{background:rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;line-height:1.45}.lesson b{display:block;color:#fff;margin-bottom:2px}.lesson span{color:var(--mut)}.lesson .mvn{color:#f7c045;font-weight:700}
.graph{width:100%;height:84px;border-radius:5px;overflow:hidden;background:#403d39;display:block;cursor:pointer;margin-bottom:12px}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acc{background:rgba(255,255,255,.05);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.acc .av{width:46px;height:46px}
.acc .num{font-size:22px;font-weight:800;padding:4px 14px;border-radius:6px;background:#fff;color:#312e2b;min-width:76px;text-align:center}
.acc.bl .num{background:#403d39;color:#fff}
.acc small{color:var(--mut);font-weight:600;font-size:11.5px}
.ctab{width:100%;border-collapse:collapse;font-size:14px}
.ctab td{padding:5px 4px}
.ctab td.c{text-align:center;font-weight:800;width:44px}
.ctab td.i{width:30px}.ctab td.i svg{width:22px;height:22px;display:block;margin:auto}
.ctab td.l{font-weight:600}
.phases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.phases div{background:rgba(255,255,255,.04);border-radius:6px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.phases svg{width:22px;height:22px}
.phases .two{display:flex;gap:6px}
.keys{display:flex;flex-direction:column;gap:6px}
.key{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:6px;padding:8px 10px;font-size:13.5px;cursor:pointer;text-align:left}
.key:hover{background:rgba(255,255,255,.1)}
.key svg{width:20px;height:20px;flex:none}
.nav{display:flex;gap:6px}
.nav .btn2{flex:1;padding:10px 0}
.prog{height:10px;border-radius:5px;background:#3d3a36;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:var(--green);transition:width .2s}
.opening{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.opening svg{width:18px;height:18px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:10px;width:340px;max-width:100%;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:mb .25s ease-out}
@keyframes mb{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.mhead{padding:18px 16px 12px;text-align:center;background:linear-gradient(#3a3835,var(--panel))}
.mhead h2{margin:0;font-size:28px;font-weight:800}
.mhead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.mvs{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0 14px}
.mvs .av{width:62px;height:62px;font-size:26px}
.mvs .win{box-shadow:0 0 0 3px var(--green)}
.mvs span{font-weight:800;color:var(--mut)}
.mbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#fff;color:#312e2b;font-weight:700;font-size:14px;border-radius:8px;padding:9px 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.err{background:#5c2b29;color:#ffd7d3;border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px}
@media (max-width:900px){
  .quick:not(:empty){width:var(--bs);margin-top:2px}
  .quick .pfoot{background:transparent;padding:4px 0 0;gap:8px}
  .quick .status{display:none}
  .quick .btn2{padding:11px 6px;font-size:14px}
  body.ingame .ph{display:none}
  body.ingame .panel{margin-top:4px}
  .app{flex-direction:column;align-items:center;gap:10px;padding:0 8px 16px}
  .panel{width:100%;max-width:calc(var(--bs) + 30px)}
  .pbody{max-height:none}
  .top{height:40px;padding:6px 10px}
}

/* ====================== Motor (Stockfish en Web Worker) ====================== */
class Engine{
  constructor(){this.q=Promise.resolve();this.lis=null;this.ok=false;this.failed=false;this.ready=this._init()}
  _spawn(file){return new Promise((res,rej)=>{let w;try{w=new Worker(file)}catch(e){return rej(e)}
    const to=setTimeout(()=>{try{w.terminate()}catch(e){};rej(new Error('timeout'))},12000);
    w.onerror=e=>{clearTimeout(to);try{w.terminate()}catch(_){};rej(e)};
    w.onmessage=e=>{const l=String(e.data);if(l==='uciok'){clearTimeout(to);w.onerror=null;res(w)}};
    w.postMessage('uci')})}
  async _init(){
    let w=null;
    if(typeof WebAssembly==='object'){try{w=await this._spawn('stockfish.js')}catch(e){w=null}}
    if(!w){try{w=await this._spawn('stockfish.asm.js')}catch(e){this.failed=true;throw e}}
    this.w=w;w.onmessage=e=>{const l=String(e.data);if(this.lis)this.lis(l)};
    this.send('setoption name Hash value 32');this.send('setoption name Skill Level value 20');
    await this._wait('isready','readyok');this.ok=true}
  send(c){this.w.postMessage(c)}
  _wait(cmd,tok){return new Promise(r=>{this.lis=l=>{if(l.startsWith(tok)){this.lis=null;r()}};this.send(cmd)})}
  analyze(fen,o){const p=this.q.then(()=>this._go(fen,o));this.q=p.catch(()=>{});return p}
  async _go(fen,{depth=12,mt=0,mpv=1}){
    await this.ready;
    this.send('setoption name MultiPV value '+mpv);
    this.send('position fen '+fen);
    return new Promise(res=>{
      const lines=[];let md=0;
      this.lis=l=>{
        if(l.startsWith('info')&&l.includes(' pv ')&&l.includes(' score ')){
          if(/ (lowerbound|upperbound) /.test(l))return;
          const d=+(/ depth (\d+)/.exec(l)||[])[1];const k=+((/ multipv (\d+)/.exec(l)||[0,1])[1]);
          const sc=/ score (cp|mate) (-?\d+)/.exec(l);const pv=l.split(' pv ')[1].trim().split(' ');
          if(!sc)return;
          lines[k-1]={depth:d,cp:sc[1]==='cp'?+sc[2]:null,mate:sc[1]==='mate'?+sc[2]:null,pv};md=Math.max(md,d);
        }else if(l.startsWith('bestmove')){this.lis=null;const bm=l.split(' ')[1];res({lines:lines.filter(Boolean),best:bm==='(none)'?null:bm,depth:md})}
      };
      this.send('go depth '+depth+(mt?' movetime '+mt:''));
    })}
}

/* Evaluaciones: siempre desde el punto de vista de las blancas */
function toW(line,fen){const f=fen.split(' ')[1]==='w'?1:-1;
  if(line.mate!==null)return {mate:line.mate*f,sgn:Math.sign(line.mate*f)||(-f)};return {cp:line.cp*f}}
function winW(e){if(e.mate!==undefined&&e.mate!==null)return e.sgn>0?100:0;return 50+50*(2/(1+Math.exp(-0.00368208*e.cp))-1)}
const winFor=(e,c)=>c==='w'?winW(e):100-winW(e);
function fmtEval(e){if(e.mate!==undefined&&e.mate!==null){if(e.mate===0)return e.sgn>0?'1-0':'0-1';return (e.sgn<0?'-':'')+'M'+Math.abs(e.mate)}
  const v=e.cp/100;return (v>0?'+':'')+v.toFixed(Math.abs(v)>=10?0:1)}
const cache=new Map();
const RD=12;
async function analyzeStd(fen){
  if(cache.has(fen))return cache.get(fen);
  const ch=new Chess(fen);const legal=ch.moves({verbose:true});
  let an;
  if(!legal.length){const stm=fen.split(' ')[1];an=ch.isCheckmate()?{eval:{mate:0,sgn:stm==='w'?-1:1},best:null,pv:[],second:null,legal:0,over:true}:{eval:{cp:0},best:null,pv:[],second:null,legal:0,over:true}}
  else if(ch.isDraw()){an={eval:{cp:0},best:legal[0].from+legal[0].to,pv:[],second:null,legal:legal.length,over:true,draw:true}}
  else{
    const r=await engine.analyze(fen,{depth:RD,mt:2500,mpv:2});
    const L0=r.lines[0]||{cp:0,mate:null,pv:[r.best]};
    an={eval:toW(L0,fen),best:r.best||L0.pv[0],pv:L0.pv,second:r.lines[1]?{eval:toW(r.lines[1],fen),uci:r.lines[1].pv[0],pv:r.lines[1].pv}:null,legal:legal.length};
  }
  cache.set(fen,an);return an;
}

/* ====================== Análisis táctico para las explicaciones ====================== */
function mat(ch,c){let s=0;for(const row of ch.board())for(const p of row)if(p)s+=(p.color===c?1:-1)*VAL[p.type];return s}
function tryMove(ch,u){try{return ch.move(uciObj(u))}catch(e){return null}}
function lineGain(fen,ucis,color){
  const ch=new Chess(fen);const b0=mat(ch,color);let firstCap=null,mates=false,n=0;
  for(let i=0;i<Math.min(ucis.length,8);i++){
    const m=tryMove(ch,ucis[i]);if(!m)break;n++;
    if(m.captured&&!firstCap)firstCap=m;
    if(ch.isCheckmate()){mates=true;break}
    const nx=ucis[i+1];if(!nx)break;
    const t=new Chess(ch.fen());const nm=tryMove(t,nx);if(!nm)break;
    if(i>=1&&!nm.captured&&!nm.san.includes('+')&&!nm.promotion)break;
  }
  return {gain:mat(ch,color)-b0,firstCap,mates,plies:n};
}
function opp(c){return c==='w'?'b':'w'}
function pieces(ch,c){const r=[];for(const row of ch.board())for(const p of row)if(p&&(!c||p.color===c))r.push(p);return r}
function hanging(ch,c){ // piezas de c atacadas e insuficientemente defendidas

    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,px=-uy,py=ux;

async function applyMove(u,isUser){
  stopPreview(false);if(S.view!=null){S.view=null;setBoard({fen:S.game.fen(),last:null,check:kingSq(S.game)});gnavUI()}const g=S.game;const fenBefore=g.fen();const m=tryMove(g,u);if(!m)return null;

function checkOver(){
  const g=S.game;if(!g.isGameOver())return false;
  let res,why;
  if(g.isCheckmate()){res=g.turn()===S.user?'lose':'win';why='por jaque mate'}
  else if(g.isStalemate()){res='draw';why='por ahogado'}
  else if(g.isInsufficientMaterial()){res='draw';why='por material insuficiente'}
  else if(g.isThreefoldRepetition()){res='draw';why='por triple repetición'}
  else {res='draw';why='por la regla de los 50 movimientos'}
  endGame(res,why);return true}

  const gid=S.gid;if(S.over)return;
  if(checkOver())return;

async function botChoose(fen,ucis){

function isSacrifice(rec){
  if(!['n','b','r','q'].includes(rec.piece))return false;
  const ch=new Chess(rec.after);const c=rec.color,o=opp(c);
  const at=ch.attackers(rec.to,o);if(!at.length)return false;
  const v=VAL[rec.piece]-(rec.captured?VAL[rec.captured]:0);if(v<2)return false;
  const def=ch.attackers(rec.to,c);const minAt=Math.min(...at.map(s=>{const q=ch.get(s);return q.type==='k'?100:VAL[q.type]}));
  if(minAt===100&&def.length)return false;
  return !def.length||minAt<VAL[rec.piece]}
function classifyOne(i,A,Bn,prevLoss,bookN){
  const m=S.hist[i];const c=m.color;
  const wb=winFor(A.eval,c),wa=winFor(Bn.eval,c);
  const isBest=A.best===m.uci;
  let loss=isBest?0:Math.max(0,wb-wa);
  let cls;
  if(A.legal===1)cls='forced';
  else if(bookN&&i<bookN)cls='book';
  else if(Bn.over&&new Chess(m.after).isCheckmate())cls='best';
  else if(isBest||loss<1)cls='best';
  else if(loss<2.5)cls='excellent';
  else if(loss<6)cls='good';
  else if(loss<11)cls='inaccuracy';
  else if(loss<20)cls='mistake';
  else cls='blunder';
  if((cls==='best'||cls==='excellent')&&A.legal>1&&wa>=48&&wb<97&&isSacrifice(m))cls='brilliant';
  else if(cls==='best'&&A.second&&A.legal>1){const ws=winFor(A.second.eval,c);
    const recap=i>0&&S.hist[i-1].captured&&S.hist[i-1].to===m.to;
    const easyCap=m.captured&&VAL[m.captured]>=3&&hanging(new Chess(m.before),opp(c)).some(p=>p.square===m.to);
    if(wb-ws>=18&&wb<97&&!recap&&!easyCap&&!m.flags.includes('k')&&!m.flags.includes('q'))cls='great'}
  const mA=mateIn(Bn.eval,c),mB=mateIn(A.eval,c);const mated=new Chess(m.after).isCheckmate();
  if(mated)cls=A.legal===1?'forced':'best';
  else if(mA<0&&mB>=0&&A.legal>1&&!['forced'].includes(cls))cls='blunder';
  else if(mB>0&&mA<=0&&A.legal>1&&!NEG[cls])cls='miss';
  if((cls==='mistake'||cls==='blunder')&&prevLoss!==null&&prevLoss>=11&&wa<=60&&wb>=55)cls='miss';
  const acc=Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*loss)-3.1669));
  return {cls,loss,wb,wa,acc,isBest}}

function explain(i,k,A,Bn,live){
  const m=S.hist[i];const c=m.color;const isU=c===S.user;const seed=hashStr(m.after+i);
  const P=isU?{Tu:'Tu',tu:'tu',Tenias:'Tenías',ganabas:'ganabas',puede:'tu rival puede',rival:'tu rival',ti:'ti'}:{Tu:'Su',tu:'su',Tenias:'Tenía',ganabas:'ganaba',puede:'puedes',rival:'tú',ti:'tu rival'};
  const title=`${MK(m.color,m.esan)} ${CLS[k.cls].t}`;

    text=lead+' '+why;
    if(!k.isBest&&bestSan&&!['book','forced','brilliant','best','great'].includes(k.cls)){

      if(k.cls==='good'&&k.wb>25&&k.wb<75)sub+=' La diferencia es pequeña, pero en partidas igualadas estos detalles suman.'}

    let why=null;
    if(mAfter<0){why=`Permite un jaque mate en ${-mAfter}: ${lineSan(m.after,reply,Math.min(reply.length,2*(-mAfter)))}.`;th='mate_allowed'}
    else if(mBefore>0&&mAfter<=0){why=`${P.Tenias} mate en ${mBefore}: ${lineSan(m.before,A.pv,Math.min(A.pv.length,2*mBefore-1))}.`;th='mate_missed'}
    if(!why){

          why=`${art(m.piece)==='la'?'La':'El'} ${NAME[m.piece]} va a ${m.to}, donde tiene ${at} atacante${at>1?'s':''} y ${df?df+' defensor'+(df>1?'es':''):'ningún defensor'}: ${P.puede} capturar${lo(m.piece)} con ${sanOf(m.after,reply[0])}.`;th='hang'}
        else if(fc&&fc.color!==c&&reply[0]&&fc.from===reply[0].slice(0,2)&&fc.to===reply[0].slice(2,4)){

          if(fk.length>=2){why=`Permite un ataque doble: con ${replySan}, ${art(r0.piece)} ${NAME[r0.piece]} ataca ${pieceList(fk)} y no se puede salvar todo.`;th='fork_allowed'}

        else{const fk=b0?forkTargets(ch,b0.to,c):[];

      }

    }
    if(!why){why=bestR?`${bestSan} era más fuerte. ${bestR.t}`:`${bestSan} era más fuerte: mantenía mejor la posición.`;th='positional'}
    else if(bestSan&&bestR&&!why.includes(bestSan))why+=` Lo correcto era ${bestSan}: ${bestR.t.charAt(0).toLowerCase()+bestR.t.slice(1)}`;
    else if(bestSan&&!why.includes(bestSan))why+=` Lo correcto era ${bestSan}.`;

    sub=`${evalLine}`+lineHtml(m.before,A.pv&&A.pv.length?A.pv:[A.best],4,'Lo que había que jugar y cómo seguía');

const DEVIL_AV='<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#3a1f1d"/><path d="M15 21l-5-13 11 8zM45 21l5-13-11 8z" fill="#e0453a"/><circle cx="30" cy="66" r="26" fill="#22201e"/><circle cx="30" cy="31" r="15" fill="#d9483b"/><path d="M20 26l7 3M40 26l-7 3" stroke="#2a0f0d" stroke-width="2.4" stroke-linecap="round"/><circle cx="24.5" cy="31" r="2" fill="#2a0f0d"/><circle cx="35.5" cy="31" r="2" fill="#2a0f0d"/><path d="M22 37c4 4.5 12 4.5 16 0" fill="none" stroke="#2a0f0d" stroke-width="2" stroke-linecap="round"/><path d="M27 40.2l1.4 2.3 1.6-2.2M31 40.2l1.5 2.3 1.4-2.3" fill="#fff"/></svg>';
const DEVIL_PH=['Si yo fuera tu rival, jugaría','Yo en su lugar jugaría','Mi plan como rival sería','Lo que más daño te haría es'];
function nullMoveFen(fen){const p=fen.split(' ');p[1]=p[1]==='w'?'b':'w';p[3]='-';return p.join(' ')}
// Devuelve la mejor jugada del rival en la posición: si le toca, su mejor respuesta; si te toca a ti, su amenaza (análisis con «jugada nula»).
async function devilAnalyze(fen,rival){
  const ch=new Chess(fen);
  if(ch.turn()===rival){const an=await analyzeStd(fen);if(!an.best)return null;return {fen,u:an.best,pv:an.pv,eval:an.eval,threat:false,base:an}}
  if(ch.inCheck())return {check:true};
  const nf=nullMoveFen(fen);let nch;try{nch=new Chess(nf)}catch(e){return null}
  if(nch.inCheck())return null;
  const an=await analyzeStd(nf);if(!an.best)return null;
  const base=await analyzeStd(fen);
  return {fen:nf,u:an.best,pv:an.pv,eval:an.eval,threat:true,base}}
function devilExplain(d,user,ply,seed){
  if(d.check)return {title:'Abogado del diablo',text:'Ahora mismo estás en jaque: la mayor amenaza del rival ya está en el tablero. Lo primero es salir del jaque, y si puedes, hacerlo ganando tiempo o material.',sub:'',tip:'Hay tres formas de salir del jaque: mover el rey, tapar el jaque o capturar la pieza que lo da.'};
  const rival=opp(user);const san=sanOf(d.fen,d.u);const r=goodReason(d.fen,d.u,(d.pv||[]).slice(1),rival,ply);
  const lead=pick(DEVIL_PH,seed);
  let text=`${lead} <b>${san}</b>. ${r?r.t:'No hay un golpe táctico inmediato: con esta jugada el rival mejoraría la posición de sus piezas.'}`;
  let sub='';
  const wNow=winFor(d.base.eval,user),wThen=winFor(d.eval,user);
  if(d.threat){
    const sev=wNow-wThen;
    if(sev>=20)text+=` Es una amenaza seria: si no reaccionas, tu posición pasaría de <b>${evalWords(d.base.eval,user)}</b> a <b>${evalWords(d.eval,user)}</b>.`;
    else if(sev>=10)text+=' Es una amenaza moderada: conviene tenerla en cuenta al elegir tu jugada.';
    else text+=' No es una amenaza grave, así que tienes libertad para seguir con tu plan.';
    if(sev>=10)sub='¿Cómo te defiendes? Puedes mover la pieza atacada, defenderla, tapar la línea de ataque o crear una amenaza mayor.';
  }else{
    text+=` Tras ella, tu posición sería de <b>${evalWords(d.eval,user)}</b>.`;
  }
  if(d.pv&&d.pv.length>1)sub=(sub||'')+lineHtml(d.fen,d.pv,5,'Lo que busca tu rival');
  const sev2=d.threat?wNow-wThen:0;
  return {title:d.threat?(sev2>=10?`La amenaza del rival: ${san}`:`El plan del rival: ${san}`):`Lo mejor para el rival: ${san}`,text,sub,tip:'Antes de mover, ponte en el lugar de tu rival y pregúntate «¿qué jugaría yo?». Es el hábito que más errores evita.'}}
function devilHtml(ex,silent){
  if(!silent)Voice.say(ex,{role:'devil'});
  return `<div class="coach devil"><div class="cav">${DEVIL_AV}${Voice.ok?`<button class="say" data-act="speak" title="Escuchar">${ICO.sound}</button>`:''}</div><div class="cbub"><div class="ct">${ICO.devil}<span>${rich(ex.title)}</span></div><p>${rich(ex.text)}</p>${ex.sub?`<div class="best">${rich(ex.sub)}</div>`:''}${ex.tip?`<div class="tip">${ICO.cap}<span><b>Lección:</b> ${ex.tip}</span></div>`:''}</div></div>`}
const DEVIL_ARROW='rgba(220,68,55,.85)';
async function gameDevil(){
  if(S.view!=null)gameNav('last');
  if(S.over||S.screen!=='game'||S.game.turn()!==S.user)return;
  const fen=S.game.fen();const box=$('#devilBox');const btn=$('#bDevil');
  if(S.devilShown===fen){S.devilShown=null;box.innerHTML='';setBoard({arrows:B.arrows.filter(a=>a.color!==DEVIL_ARROW)});Voice.stop();return}
  if(btn)btn.disabled=true;setStatus('<div class="spin"></div>El abogado del diablo está pensando…');
  try{const d=await devilAnalyze(fen,opp(S.user));if(S.game.fen()!==fen)return;
    if(!d){box.innerHTML=devilHtml({title:'Abogado del diablo',text:'Ahora mismo el rival no tiene ninguna amenaza clara.',sub:''});}
    else{S.devilShown=fen;box.innerHTML=devilHtml(devilExplain(d,S.user,S.hist.length,hashStr(fen)));
      if(d.u)setBoard({arrows:[...B.arrows.filter(a=>a.color!==DEVIL_ARROW),{from:d.u.slice(0,2),to:d.u.slice(2,4),color:DEVIL_ARROW}]})}
    Snd.play('notify');setStatus('Tu turno');
  }catch(e){setStatus('No se pudo analizar la amenaza.')}finally{if(btn)btn.disabled=false}}
async function reviewDevil(p){
  const rv=S.rv;const box=$('#devilBox');if(!box)return;
  if(!rv.devil){box.innerHTML='';return}
  const fen=p?S.hist[p-1].after:START;box.innerHTML='<div class="status" style="padding:4px 2px"><div class="spin"></div>El abogado del diablo está pensando…</div>';
  try{const d=await devilAnalyze(fen,opp(S.user));if(rv.ply!==p||!rv.devil||S.screen!=='review')return;
    if(!d||d.check&&false){box.innerHTML=devilHtml({title:'Abogado del diablo',text:'En esta posición el rival no tiene ninguna jugada peligrosa.',sub:''},true);return}
    const ex=devilExplain(d,S.user,p,hashStr(fen));
    if(!d.threat&&p&&S.hist[p-1].color===S.user)ex.text=ex.text.replace(/^[^<]*<b>/,`Tras tu jugada, lo mejor para el rival es <b>`);
    box.innerHTML=devilHtml(ex,true);
    if(d.u)setBoard({arrows:[...B.arrows.filter(a=>a.color!==DEVIL_ARROW),{from:d.u.slice(0,2),to:d.u.slice(2,4),color:DEVIL_ARROW}]});
    rv.devilEx=ex;
  }catch(e){box.innerHTML=''}}

      ${(()=>{const oc=overviewCoach();Voice.say({title:'',text:oc});return `<div class="coach"><div class="cav">${COACH_AV}${Voice.ok?`<button class="say" data-act="speak" title="Escuchar">${ICO.sound}</button>`:''}</div><div class="cbub"><p style="margin:0">${rich(oc)}</p></div></div>`})()}
      ${graphSvg()}
      <div class="accs">
        <div class="acc">${W.av}<span>${W.name}</span><div class="num">${sw.acc}</div><small>Rendimiento ≈ ${perfRating(sw.acc)}</small></div>
        <div class="acc bl">${Bk.av}<span>${Bk.name}</span><div class="num">${sb.acc}</div><small>Rendimiento ≈ ${perfRating(sb.acc)}</small></div>
      </div>
      <table class="ctab">${CLS_ORDER.map(k=>`<tr><td class="l">${CLS[k].n}</td><td class="c" style="color:${CLS[k].c}">${sw.cnt[k]}</td><td class="i">${icon(k)}</td><td class="c" style="color:${CLS[k].c}">${sb.cnt[k]}</td></tr>`).join('')}</table>
      <div class="phases"><div>Apertura<span class="two">${phaseIcon('w',0)}${phaseIcon('b',0)}</span></div><div>Medio juego<span class="two">${phaseIcon('w',1)}${phaseIcon('b',1)}</span></div><div>Final<span class="two">${phaseIcon('w',2)}${phaseIcon('b',2)}</span></div></div>
      ${bi.name?`<div class="opening" style="margin-top:12px">${ICO.book}${bi.name}</div>`:''}
      ${lessonsHtml()}
    </div>
    <div class="pfoot"><button class="btn" data-act="rvstart">Empezar revisión</button><div class="row"><button class="btn2" data-act="rematch">Revancha</button><button class="btn2" data-act="new">Nueva partida</button></div></div>`;
  }else{
    const keys=S.rv.k.map((k,i)=>({k,i})).filter(o=>S.hist[o.i].color===S.user&&(['blunder','mistake','miss','brilliant','great'].includes(o.k.cls)));
    panel.innerHTML=`<div class="ph">${ICO.star.replace('currentColor','#81b64c')}Revisión de partida</div>
    <div id="coachBox" class="cbx"></div>
    <div id="devilBox" class="cbx"></div>
    <div class="pbody" id="pb">
      ${graphSvg()}
      ${keys.length?`<div class="lbl">Tus momentos clave</div><div class="keys">${keys.slice(0,6).map(o=>`<div class="key" data-act="goto" data-v="${o.i+1}">${icon(o.k.cls)}<span>${Math.floor(o.i/2)+1}${o.i%2?'...':'.'} ${S.hist[o.i].esan} — ${CLS[o.k.cls].n}</span></div>`).join('')}</div>`:''}
      <div class="lbl">Jugadas</div>
      <div class="nota" data-act="notation">¿Cómo se leen las jugadas de la lista?</div><div id="notaHelp"><b>Las casillas</b> se nombran con una letra (columna, de la a a la h) y un número (fila, del 1 al 8). Ejemplo: <b>e4</b>.<br><b>Las piezas</b> se escriben con su inicial: <b>C</b> caballo, <b>A</b> alfil, <b>T</b> torre, <b>D</b> dama, <b>R</b> rey. Si no hay letra, es un peón.<br><b>Cf3</b> = el caballo va a f3. <b>x</b> significa captura: <b>Axf7</b> = el alfil captura en f7.<br><b>+</b> es jaque, <b>#</b> es jaque mate, <b>O-O</b> es enroque corto y <b>O-O-O</b> enroque largo.<br>En las explicaciones del entrenador verás las jugadas con el dibujo de la pieza y en palabras, y puedes pulsar <b>«Verlo en el tablero»</b> para verlas animadas.</div>
      <div class="moves" id="mlist"></div>
    </div>
    <div class="pfoot">
      <div class="row" id="rvActs"></div>
      <div class="nav"><button class="btn2" data-act="nav" data-v="first">${ICO.first}</button><button class="btn2" data-act="nav" data-v="prev">${ICO.prev}</button><button class="btn2" data-act="nav" data-v="next">${ICO.next}</button><button class="btn2" data-act="nav" data-v="last">${ICO.last}</button></div>
      <button class="btn2" data-act="overview" style="background:transparent;box-shadow:none;color:var(--mut);padding:4px">Ver resumen</button>
    </div>`;
    renderMoves();
  }}
function showPly(p,silent){
  const rv=S.rv;p=Math.max(0,Math.min(S.hist.length,p));const changed=p!==rv.ply;rv.ply=p;S.screen='review';B.interactive=null;
  const fen=p?S.hist[p-1].after:START;const ch=new Chess(fen);
  const m=p?S.hist[p-1]:null;const k=p?rv.k[p-1]:null;
  let arrows=[];if(m&&k&&!k.isBest&&rv.an[p-1].best&&k.cls!=='book'&&k.cls!=='forced'){const b=rv.an[p-1].best;arrows=[{from:b.slice(0,2),to:b.slice(2,4)}]}
  if(rv.showBest&&rv.an[p]&&rv.an[p].best&&!rv.an[p].over){const b=rv.an[p].best;arrows=[{from:b.slice(0,2),to:b.slice(2,4)}]}
  const extra={last:m?{from:m.from,to:m.to}:null,lastColor:k?hlColor(k.cls):null,icon:m&&k?{sq:m.to,cls:k.cls}:null,arrows,check:kingSq(ch),sel:null,dests:[],hintSq:null};
  if(changed&&m&&p===rv.lastShown+1){B.fen=m.before;B.icon=null;B.arrows=[];renderBoard();animateTo(fen,m,extra);if(!silent)playSound(m,ch,m.color===S.user)}
  else{setBoard({fen,...extra});if(changed&&m&&!silent)Snd.play('move')}
  rv.lastShown=p;
  setEvalBar(rv.an[p].eval,true);renderBars(fen);
  const g=$('#graph');if(g)g.outerHTML=graphSvg();
  if(rv.view==='moves'){
    const box=$('#coachBox');
    if(box){if(!m){box.innerHTML=coachHtml({cls:null,title:'Posición inicial',text:'Pulsa ▶ para avanzar jugada a jugada: te explico qué pasó, por qué y qué lección sacar. La cifra de la esquina es la evaluación del motor: +1,0 equivale más o menos a un peón de ventaja para las blancas, y los números negativos indican ventaja de las negras.',sub:''},rv.an[0].eval)}
      else box.innerHTML=coachHtml(explain(p-1,k,rv.an[p-1],rv.an[p],false),rv.an[p].eval)}
    const acts=$('#rvActs');
    if(acts){let h='';
      if(m&&k&&NEG[k.cls]&&m.color===S.user)h+=`<button class="btn sm" data-act="retry">${'Reintentar'}</button>`;
      h+=`<button class="btn2 ${rv.showBest?'on':''}" data-act="showbest">${ICO.star}Mejor jugada</button>`;
      h+=`<button class="btn2 ${rv.devil?'on dv':''}" data-act="rvdevil">${ICO.devil}Abogado del diablo</button>`;
      acts.innerHTML=h}
    renderMoves();
    reviewDevil(p);
  }}
function retryStart(){
  const rv=S.rv;const i=rv.ply-1;const m=S.hist[i];S.screen='retry';rv.retryI=i;
  setBoard({fen:m.before,last:i>0?{from:S.hist[i-1].from,to:S.hist[i-1].to}:null,lastColor:null,icon:null,arrows:[],check:kingSq(new Chess(m.before)),interactive:S.user});
  setEvalBar(null,false);layout();
  const ch=new Chess(m.before);const hang=hanging(ch,S.user),oh=hanging(ch,opp(S.user));
  let clue='Repasa en orden: jaques, capturas y amenazas.';
  if(hang.length)clue=`Pista: ${ownPieceDesc(hang[0],true)} está en peligro.`;else if(oh.length)clue=`Pista: ${art(oh[0].type)} ${NAME[oh[0].type]} rival de ${oh[0].square} no está bien defendid${FEM[oh[0].type]?'a':'o'}.`;
  $('#coachBox').innerHTML=coachHtml({cls:null,title:'¡Inténtalo otra vez!',text:`En esta posición jugaste ${MK(m.color,m.esan)}. Busca una jugada mejor.`,sub:clue},null);
  $('#rvActs').innerHTML=`<button class="btn2" data-act="solution">${ICO.bulb}Ver solución</button><button class="btn2" data-act="retryexit">Volver</button>`;
}
async function retryMove(u){
  const rv=S.rv;const i=rv.retryI;const m=S.hist[i];const A=rv.an[i];
  const ch=new Chess(m.before);const mv=tryMove(ch,u);if(!mv)return;
  B.interactive=null;await animateTo(ch.fen(),mv,{last:{from:mv.from,to:mv.to},check:kingSq(ch)});playSound(mv,ch,true);
  let ok=u===A.best;
  if(!ok){$('#coachBox').innerHTML=coachHtml({cls:null,title:'Comprobando…',text:'Un segundo.',sub:''},null,true);
    try{const an=await analyzeStd(ch.fen());ok=winFor(A.eval,m.color)-winFor(an.eval,m.color)<2.5}catch(e){}}
  if(S.screen!=='retry')return;
  if(ok){Snd.play('good');setBoard({icon:{sq:mv.to,cls:u===A.best?'best':'excellent'},lastColor:hlColor('best')});
    const r=goodReason(m.before,u,u===A.best?A.pv.slice(1):[],m.color,i);
    $('#coachBox').innerHTML=coachHtml({cls:u===A.best?'best':'excellent',title:`¡Muy bien! ${MK(mv.color,esSan(mv.san))} es ${u===A.best?'la mejor':'excelente'}`,text:r?r.t:'Es la jugada que mantiene la mejor posición.',sub:'',tip:r?TIP[r.th]:null},null);
    $('#rvActs').innerHTML=`<button class="btn sm" data-act="retryexit">Continuar revisión</button>`}
  else{Snd.play('bad');$('#coachBox').innerHTML=coachHtml({cls:'mistake',title:`${MK(mv.color,esSan(mv.san))} tampoco es la mejor`,text:'Vuelve a intentarlo. Piensa en jaques, capturas y amenazas, y comprueba qué piezas quedan sin defensa.',sub:''},null);
    setTimeout(()=>{if(S.screen!=='retry')return;setBoard({fen:m.before,last:null,icon:null,check:kingSq(new Chess(m.before)),interactive:S.user})},900)}}
function retrySolution(){const rv=S.rv;const i=rv.retryI;const m=S.hist[i];const A=rv.an[i];if(!A.best)return;
  setBoard({fen:m.before,arrows:[{from:A.best.slice(0,2),to:A.best.slice(2,4)}],interactive:S.user});
  const r=goodReason(m.before,A.best,A.pv.slice(1),m.color,i);
  $('#coachBox').innerHTML=coachHtml({cls:'best',title:`La solución es ${sanOf(m.before,A.best)}`,text:r?r.t:'Es la jugada que mantiene la mejor posición.',sub:A.pv.length>1?lineHtml(m.before,A.pv,5,'La solución paso a paso'):'',tip:r?TIP[r.th]:null},null);Snd.play('notify')}
function retryExit(){S.screen='review';const p=S.rv.ply;S.rv.lastShown=-9;reviewPanel();showPly(p,true);layout()}

/* ====================== Eventos ====================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;Snd.init();
  switch(a){
    case 'mode':S.mode=v;store('mode',v);setupPanel();break;
    case 'live':S.live=!S.live;store('live',S.live);setupPanel();break;
    case 'bot':S.botIdx=+v;store('bot',S.botIdx);setupPanel();renderBars(B.fen);break;
    case 'color':S.colorPref=v;store('color',v);setupPanel();break;
    case 'play':startGame();break;
    case 'speak':{const dv=t.closest('.devil');if(dv&&S.rv&&S.rv.devilEx&&S.screen==='review')Voice.sayText(speakable(S.rv.devilEx),true,{role:'devil'});else if(dv){Voice.sayText(speakable({title:dv.querySelector('.ct').textContent,text:dv.querySelector('p').innerHTML,sub:(dv.querySelector('.best')||{}).innerHTML,tip:''}),true,{role:'devil'})}else if(Voice.last)Voice.sayText(Voice.last,true,{role:'coach'});}break;
    case 'vtest':Voice.sayText(v==='devil'?'Hola. Soy el abogado del diablo. Te diré lo que haría tu rival.':'Hola. Soy tu entrenador. Te explicaré cada jugada para que mejores.',true,{role:v});break;
    case 'devil':gameDevil();break;
    case 'gnav':gameNav(v);break;
    case 'gply':gameNav(+v);break;
    case 'tab':S.tab=v;S.op=null;B.orient='w';renderBars(START);setupPanel();break;
    case 'op':S.op=v;setupPanel();break;
    case 'opback':S.op=null;B.orient='w';renderBars(START);setupPanel();break;
    case 'lesson':startLesson(v,t.dataset.m);break;
    case 'ogtoggle':S.ogOpen=!S.ogOpen;setupPanel();break;
    case 'opspeak':{const o=opById(S.op);if(o)Voice.sayText(opInfoSpeech(o),true,{role:'coach'})}break;
    case 'lpracmode':startLesson(S.les.kind,'practice');break;
    case 'lguide':startLesson(S.les.kind,'guide');break;
    case 'lsolve':if(S.les&&!S.les.done&&B.interactive){S.les.tries=Math.max(S.les.tries,2);lessonMove('xxxx')}break;
    case 'lback':lessonBack();break;
    case 'larrow':S.les.arrows=!S.les.arrows;lessonFoot();if(!S.les.done){const mv=sanMove(S.les.ch,S.les.L.m[S.les.i][0]);if(mv&&S.les.ch.turn()===S.les.L.side)setBoard({arrows:S.les.arrows?[{from:mv.from,to:mv.to,color:'rgba(129,182,76,.85)'}]:[]})}break;
    case 'lexit':{S.gid++;Voice.stop();const op=S.les&&S.les.o.id;toSetup();S.tab='open';S.op=op;setupPanel()}break;
    case 'lrestart':startLesson(S.les.kind,S.les.mode);break;
    case 'lother':startLesson(S.les.kind==='learn'?'counter':'learn','guide');break;
    case 'lpractice':lessonPractice();break;
    case 'playline':playLine(t.dataset.fen,t.dataset.line.split(' '));break;
    case 'pvclose':stopPreview();break;
    case 'notation':{const n=$('#notaHelp');if(n)n.classList.toggle('on')}break;
    case 'rvdevil':S.rv.devil=!S.rv.devil;showPly(S.rv.ply,true);break;
    case 'devilopt':S.devil=!S.devil;store('devil',S.devil);setupPanel();break;
    case 'voice':Voice.on=!Voice.on;store('voice',Voice.on);if(!Voice.on)Voice.stop();else Voice.sayText('Hola. Soy tu entrenador. Te iré explicando cada jugada.');setupPanel();voiceIcon();break;
    case 'hint':giveHint();break;
    case 'undo':undo();break;
    case 'resign':if(!S.over&&S.hist.length){if(t.dataset.confirm){endGame('lose','por abandono')}else{t.dataset.confirm=1;t.innerHTML=ICO.flag+'¿Seguro?';t.style.background='#a33a2f';setTimeout(()=>{if(t.isConnected){delete t.dataset.confirm;t.innerHTML=ICO.flag+'Abandonar';t.style.background=''}},2500)}}else if(!S.over){S.gid++;toSetup()}break;
    case 'review':startReview();break;
    case 'rematch':$('#modal').classList.remove('on');startGame();break;
    case 'new':$('#modal').classList.remove('on');toSetup();break;
    case 'closemodal':$('#modal').classList.remove('on');break;
    case 'rvstart':S.rv.view='moves';S.rv.lastShown=-9;reviewPanel();showPly(0);break;
    case 'overview':S.rv.view='overview';reviewPanel();showPly(S.rv.ply,true);break;
    case 'goto':if(S.screen==='review'){if(S.rv.view!=='moves'){S.rv.view='moves';reviewPanel()}showPly(+v)}break;
    case 'nav':navRv(v);break;
    case 'showbest':S.rv.showBest=!S.rv.showBest;showPly(S.rv.ply,true);break;
    case 'retry':retryStart();break;
    case 'solution':retrySolution();break;
    case 'retryexit':retryExit();break;
  }});
function navRv(v){if(S.screen!=='review'||!S.rv||!S.rv.done)return;if(S.rv.view!=='moves'){S.rv.view='moves';reviewPanel()}
  const p=S.rv.ply;showPly(v==='first'?0:v==='prev'?p-1:v==='next'?p+1:S.hist.length)}
document.addEventListener('keydown',e=>{if(S.screen==='game'){const k={ArrowRight:'next',ArrowLeft:'prev',ArrowUp:'first',ArrowDown:'last'}[e.key];if(k){gameNav(k);e.preventDefault()}return}
  if(S.screen!=='review')return;
  if(e.key==='ArrowRight'){navRv('next');e.preventDefault()}else if(e.key==='ArrowLeft'){navRv('prev');e.preventDefault()}else if(e.key==='ArrowUp'){navRv('first');e.preventDefault()}else if(e.key==='ArrowDown'){navRv('last');e.preventDefault()}});
document.addEventListener('click',e=>{const g=e.target.closest('#graph');if(!g||!S.rv||!S.rv.done)return;const r=g.getBoundingClientRect();const p=Math.round((e.clientX-r.left)/r.width*S.hist.length);if(S.rv.view!=='moves'){S.rv.view='moves';reviewPanel()}showPly(p)});
$('#bFlip').onclick=()=>{B.orient=B.orient==='w'?'b':'w';renderBoard();renderBars(B.fen);const eb=$('#evalbar');eb.classList.toggle('flip',B.orient==='b')};
function voiceIcon(){const b=$('#bVoice');if(!Voice.ok){b.style.display='none';return}b.innerHTML=Voice.on?ICO.voice:ICO.voiceOff;b.style.color=Voice.on?'#81b64c':''}
$('#bVoice').onclick=()=>{Voice.on=!Voice.on;store('voice',Voice.on);if(!Voice.on)Voice.stop();else Voice.sayText('Voz del entrenador activada.');voiceIcon();if(S.screen==='setup')setupPanel()};
document.addEventListener('change',e=>{if(e.target.id==='vsel'){Voice.name=e.target.value;store('voiceName',Voice.name);Voice.sayText('Hola. Así sonará tu entrenador.',true,{role:'coach'})}if(e.target.id==='vsel2'){Voice.dname=e.target.value;store('voiceDevil',Voice.dname);Voice.sayText('Hola. Así sonará el abogado del diablo.',true,{role:'devil'})}});
function soundIcon(){$('#bSound').innerHTML=Snd.on?ICO.sound:ICO.mute}
$('#bSound').onclick=()=>{Snd.on=!Snd.on;store('sound',Snd.on);soundIcon();if(Snd.on)Snd.play('move')};
function toSetup(){document.body.classList.remove('ingame');S.screen='setup';S.gid++;S.over=null;S.rv=null;B.interactive=null;B.orient='w';
  setBoard({fen:START,last:null,lastColor:null,arrows:[],icon:null,check:null,sel:null,dests:[],hintSq:null});setEvalBar(null,false);layout();S.user='w';renderBars(START);setupPanel()}

/* Botones bajo el tablero en móvil */
const isMobile=()=>innerWidth<=900;
function placeFoot(render){const q=$('#quick');
  if(isMobile()){const f=panel.querySelector('.pfoot');if(f){q.replaceChildren(f)}else if(render){q.innerHTML=''}}
  else{const f=q.querySelector('.pfoot');if(f)panel.appendChild(f);q.innerHTML=''}
  layout()}
new MutationObserver(recs=>{if(recs.some(r=>r.addedNodes.length))placeFoot(true)}).observe(panel,{childList:true});
addEventListener('resize',()=>placeFoot(false));

/* ====================== Arranque ====================== */
buildBoard();soundIcon();voiceIcon();toSetup();
engine.ready.then(()=>{if(S.screen==='setup')setupPanel()}).catch(()=>{if(S.screen==='setup')setupPanel()});
/* App instalable y modo sin conexión (service worker) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname)){
  addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').then(reg=>{
    const first=!navigator.serviceWorker.controller;
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{
      if(w.state==='activated'){if(first)toast('Listo: Jaque ya funciona sin conexión.');else toast('Jaque se ha actualizado. Los cambios se verán al volver a abrirla.')}})})
  }).catch(()=>{})}catch(e){}})}
window.__app={OPENINGS,S,B,engine,startGame,onUserMove,endGame,startReview,analyzeStd};
</script>
</body>
